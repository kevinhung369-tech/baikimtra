<div class="col-md-3 col-lg-2 bg-dark text-white d-flex flex-column p-3 rounded-start" style="min-height: 80vh; background-color: #162238 !important;">
    <div class="mb-4 px-2">
        <div class="fw-bold fs-6">Quản trị</div>
        <small class="text-secondary">Nhà sách Sông Hương</small>
    </div>

    <ul class="nav nav-pills flex-column gap-1 mb-auto">
        <li class="nav-item">
            <a href="{{ url_for('admin_dashboard') }}" class="nav-link text-white {{ 'active bg-secondary' if request.endpoint == 'admin_dashboard' }}">
                Tổng quan
            </a>
        </li>
        <li class="nav-item">
            <a href="{{ url_for('admin_books') }}" class="nav-link text-white {{ 'active bg-secondary' if request.endpoint in ['admin_books', 'new_book', 'edit_book'] }}">
                Sách
            </a>
        </li>
        <li class="nav-item">
            <a href="{{ url_for('admin_categories') }}" class="nav-link text-white {{ 'active bg-secondary' if request.endpoint == 'admin_categories' }}">
                Danh mục
            </a>
        </li>
        <li class="nav-item">
            <a href="{{ url_for('admin_orders') }}" class="nav-link text-white d-flex justify-content-between align-items-center {{ 'active bg-secondary' if request.endpoint in ['admin_orders', 'admin_order_detail'] }}">
                <span>Đơn hàng</span>
                {% if pending_orders_badge > 0 %}
                    <span class="badge rounded-pill bg-danger">{{ pending_orders_badge }}</span>
                {% endif %}
            </a>
        </li>
    </ul>

    <hr class="border-secondary">
    <a href="{{ url_for('books') }}" class="text-decoration-none text-light small px-2">
        &larr; Trang bán hàng
    </a>
</div>
